services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: dhi.io/redis:8-debian-dev
    ports:
      - "6379:6379"

  rabbitmq:
    image: dhi.io/rabbitmq:4-debian-dev
    ports:
      - "5672:5672"
      - "15672:15672"

  prometheus:
    image: dhi.io/prometheus:3.13
    user: "0:0"
    container_name: prometheus
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - prom_data:/prometheus

volumes:
  prom_data:
    name: test-compass_prom_data
    external: true
